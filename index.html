
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack a Mole English Game</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(#9be7ff, #fce5a5);
  color: #51351d;
}
h1 {
  color: #e66a20;
  font-size: 32px;
  text-shadow: 2px 2px white;
}
.machine {
  background: #ffb347;
  border: 9px solid #b85b24;
  border-radius: 30px;
  max-width: 650px;
  margin: 20px auto;
  padding: 20px;
  box-shadow: 0 10px 0 #91451d;
}
.holes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.hole {
  height: 115px;
  background: #78401f;
  border: 7px solid #542c18;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
}
.mole {
  font-size: 65px;
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  animation: pop .3s ease-out;
}
@keyframes pop {
  from { bottom: -90px; }
  to { bottom: -10px; }
}
.hammer {
  font-size: 55px;
  display: inline-block;
  transition: transform .2s;
}
.hit {
  transform: rotate(-65deg) translateY(15px);
}
.question {
  font-size: 23px;
  font-weight: bold;
  margin: 20px 0;
}
.answers {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}
button {
  background: #48b85b;
  color: white;
  border: none;
  border-radius: 15px;
  padding: 13px 22px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px #287c38;
}
button:hover {
  background: #299b45;
}
button:disabled {
  opacity: .5;
  cursor: default;
}
#message {
  font-size: 22px;
  font-weight: bold;
  min-height: 35px;
}
#score {
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🐹 WHACK-A-MOLE! 🔨</h1>
<h2>English Quiz Game</h2>

<div id="score">⭐ Score: 0 / 10</div>

<div class="machine">
  <div class="holes" id="holes">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>
  <div class="hammer" id="hammer">🔨</div>
</div>

<div class="question" id="question">
  Question 1: What color is the sky?
</div>

<div class="answers" id="answers"></div>

<p id="message">Choose the correct answer!</p>

<button id="next" onclick="nextQuestion()" hidden>
  Next Question ➡️
</button>

<script>
const questions = [
  {
    q: "What color is the sky?",
    a: ["Blue", "Green", "Red"],
    correct: "Blue"
  },
  {
    q: "How many legs does a cat have?",
    a: ["Two", "Four", "Six"],
    correct: "Four"
  },
  {
    q: "What is the opposite of hot?",
    a: ["Cold", "Big", "Happy"],
    correct: "Cold"
  },
  {
    q: "Which animal says 'Woof'?",
    a: ["Cat", "Dog", "Bird"],
    correct: "Dog"
  },
  {
    q: "What fruit is yellow?",
    a: ["Banana", "Apple", "Grape"],
    correct: "Banana"
  },
  {
    q: "How many days are in a week?",
    a: ["Five", "Seven", "Ten"],
    correct: "Seven"
  },
  {
    q: "What do we drink?",
    a: ["Water", "Shoes", "Books"],
    correct: "Water"
  },
  {
    q: "What is the opposite of big?",
    a: ["Tall", "Small", "Fast"],
    correct: "Small"
  },
  {
    q: "Which animal can fly?",
    a: ["Fish", "Bird", "Dog"],
    correct: "Bird"
  },
  {
    q: "What is 2 + 2?",
    a: ["Three", "Four", "Five"],
    correct: "Four"
  }
];

let current = 0;
let score = 0;
let answered = false;

const holes = document.querySelectorAll(".hole");

function showQuestion() {
  answered = false;
  document.getElementById("message").textContent =
    "Choose the correct answer!";
  document.getElementById("next").hidden = true;

  document.getElementById("question").textContent =
    "Question " + (current + 1) + ": " + questions[current].q;

  document.getElementById("answers").innerHTML = "";

  holes.forEach(hole => hole.innerHTML = "");

  let molePosition = Math.floor(Math.random() * 6);
  holes[molePosition].innerHTML = '<div class="mole">🐹</div>';

  questions[current].a.forEach(answer => {
    let btn = document.createElement("button");
    btn.textContent = answer;
    btn.onclick = () => checkAnswer(answer, btn);
    document.getElementById("answers").appendChild(btn);
  });
}

function checkAnswer(answer, button) {
  if (answered) return;
  answered = true;

  document.querySelectorAll(".answers button").forEach(btn => {
    btn.disabled = true;
  });

  const correct = questions[current].correct;

  if (answer === correct) {
    score++;
    document.getElementById("message").textContent =
      "🎉 Correct! WHACK! 🐹🔨";

    document.getElementById("hammer").classList.add("hit");

    button.style.background = "#168c35";

    holes.forEach(hole => {
      const mole = hole.querySelector(".mole");
      if (mole) {
        mole.textContent = "😵";
        mole.style.transform = "translateX(-50%) rotate(25deg)";
      }
    });

    setTimeout(() => {
      document.getElementById("hammer").classList.remove("hit");
    }, 400);

  } else {
    document.getElementById("message").textContent =
      "❌ Wrong! Correct answer: " + correct;
    button.style.background = "#d83c3c";
  }

  document.getElementById("score").textContent =
    "⭐ Score: " + score + " / 10";

  document.getElementById("next").hidden = false;
  document.getElementById("next").textContent =
    current === 9 ? "See Results 🏆" : "Next Question ➡️";
}

function nextQuestion() {
  current++;

  if (current >= questions.length) {
    finishGame();
  } else {
    showQuestion();
  }
}

function finishGame() {
  document.querySelector(".machine").style.display = "none";
  document.getElementById("question").textContent =
    "🏆 GAME OVER!";
  document.getElementById("answers").innerHTML = "";
  document.getElementById("message").textContent =
    score >= 8 ? "Amazing! You are an English champion! 🎉" :
    score >= 5 ? "Good job! Keep learning! ⭐" :
    "Nice try! Practice more! 💪";

  document.getElementById("score").textContent =
    "Your final score: " + score + " / 10";

  document.getElementById("next").textContent = "Play Again 🔄";
  document.getElementById("next").hidden = false;
  document.getElementById("next").onclick = () => location.reload();
}

showQuestion();
</script>
</body>
</html>
